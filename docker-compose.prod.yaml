# Production stack deployed to the DigitalOcean droplet.
# `be-api` and `db-init` run the image published to GHCR by the CD pipeline
# (.github/workflows/cd.yaml). Set API_IMAGE in the droplet's `.env`, e.g.
#   API_IMAGE=ghcr.io/<owner>/be-capstone:latest
# Then deploy with: docker compose pull && docker compose up -d --remove-orphans

volumes:
  postgres_data:
  redis_data:

services:
  # ── Ingress ─────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: capstone-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      be-api:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost/nginx-health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Data stores ─────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    restart: unless-stopped
    env_file:
      - '.env'
    command:
      - 'postgres'
      - '-c'
      - 'log_destination=jsonlog'
      - '-c'
      - 'logging_collector=on'
      - '-c'
      - 'log_min_messages=info'
      - '-c'
      - 'log_statement=ddl'
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-be-capstone}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Identity ────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: capstone-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - '.env'
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - 'logging=true'

  # ── Database init (migrations + seed) ───────────────

  db-init:
    image: ${API_IMAGE:?set API_IMAGE in .env, e.g. ghcr.io/<owner>/be-capstone:latest}
    container_name: capstone-db-init
    env_file:
      - '.env'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        echo "Running database migrations..."
        node ./node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js
        echo "Running database seed..."
        node dist/database/seeds/seed.js
        echo "Database init complete."
    restart: 'no'
    labels:
      - 'logging=true'

  # ── Backend API ─────────────────────────────────────

  be-api:
    image: ${API_IMAGE:?set API_IMAGE in .env, e.g. ghcr.io/<owner>/be-capstone:latest}
    container_name: capstone-be-api
    restart: unless-stopped
    env_file:
      - '.env'
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost:3000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'
