volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:

services:
  # ── Ingress ─────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: capstone-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      be-api:
        condition: service_healthy
      keycloak:
        condition: service_started
      grafana:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost/nginx-health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Data stores ─────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    restart: unless-stopped
    env_file:
      - '.env.prod.local'
    command:
      - 'postgres'
      - '-c'
      - 'log_destination=jsonlog'
      - '-c'
      - 'logging_collector=on'
      - '-c'
      - 'log_min_messages=info'
      - '-c'
      - 'log_statement=ddl'
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-be-capstone}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Identity ────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: capstone-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - '.env.prod.local'
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - 'logging=true'

  # ── Backend API ─────────────────────────────────────

  be-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-be-api
    restart: unless-stopped
    env_file:
      - '.env.prod.local'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost:3000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Observability ───────────────────────────────────

  loki:
    image: grafana/loki:3.4.2
    container_name: capstone-loki
    restart: unless-stopped
    user: '0'
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost:3100/ready || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: capstone-alloy
    restart: unless-stopped
    command:
      - 'run'
      - '/etc/alloy/config.alloy'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    container_name: capstone-grafana
    restart: unless-stopped
    env_file:
      - '.env.prod.local'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
