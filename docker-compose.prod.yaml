volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:

services:
  # ── Ingress ─────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: capstone-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      be-api:
        condition: service_healthy
      keycloak:
        condition: service_started
      grafana:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost/nginx-health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Data stores ─────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-be-capstone}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    command:
      - 'postgres'
      - '-c'
      - 'log_destination=jsonlog'
      - '-c'
      - 'logging_collector=on'
      - '-c'
      - 'log_min_messages=info'
      - '-c'
      - 'log_statement=ddl'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-be-capstone}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Identity ────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: capstone-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-be-capstone}
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_LOG_CONSOLE_OUTPUT: json
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - 'logging=true'

  # ── Backend API ─────────────────────────────────────

  be-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-be-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-be-capstone}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_HEALTH_URL: http://keycloak:9000/health/ready
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-be-capstone}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-be-capstone-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-be-capstone-secret}
      KEYCLOAK_REDIRECT_URI: ${PUBLIC_URL:-http://localhost}/api/auth/callback
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-random-secret}
      # false: plain http://localhost (nginx :80). Set true when the public URL is https://...
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost:3000/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - 'logging=true'

  # ── Observability ───────────────────────────────────

  loki:
    image: grafana/loki:3.4.2
    container_name: capstone-loki
    restart: unless-stopped
    user: '0'
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --output-document=- http://localhost:3100/ready || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: capstone-alloy
    restart: unless-stopped
    command:
      - 'run'
      - '/etc/alloy/config.alloy'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    container_name: capstone-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost}/gfn/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
