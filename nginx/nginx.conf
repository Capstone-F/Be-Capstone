worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Shared proxy headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream be_api {
        server be-api:3000;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name _;

        # ── BE API: /api/* → be-api:3000/* (strip prefix) ────────
        location /api/ {
            proxy_pass http://be_api/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_cookie_path / /;
        }

        # ── Keycloak: /auth/* → keycloak:8080/auth/* (KC serves under /auth) ──
        location /auth/ {
            proxy_pass         http://keycloak;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;

            proxy_buffer_size        128k;
            proxy_buffers          4 256k;
            proxy_busy_buffers_size  256k;
        }

        # ── Root → redirect to API health check ──────────────────
        location = / {
            return 302 /api/health;
        }

        # ── Nginx health (for container healthcheck) ─────────────
        location = /nginx-health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
