name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: be-capstone
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d be-capstone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://admin:admin@localhost:5432/be-capstone
      KEYCLOAK_URL: http://localhost:8081
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_HEALTH_URL: http://localhost:9000/health/ready
      KEYCLOAK_REALM: be-capstone
      KEYCLOAK_CLIENT_ID: be-capstone-api
      KEYCLOAK_CLIENT_SECRET: be-capstone-secret
      KEYCLOAK_REDIRECT_URI: http://localhost:3000/auth/callback
      NODE_ENV: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand
