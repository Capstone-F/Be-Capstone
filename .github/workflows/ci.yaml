name: CI

on:
  pull_request:
  push:
    branches:
      - main

# The API runs directly on the runner (not inside Docker).
# Only Postgres is available as a service container.
# Auth0 is NOT contacted from CI — unit tests mock all Auth0 HTTP calls.
# AUTH0_* env vars are set so the app config validation passes at startup.

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run secretlint
        run: npm run secretlint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: be-capstone
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d be-capstone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://admin:admin@localhost:5432/be-capstone
      AUTH0_DOMAIN: tenant.us.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-client-secret
      AUTH0_AUDIENCE: https://api.be-capstone.local
      AUTH0_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: ci-session-secret
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand
