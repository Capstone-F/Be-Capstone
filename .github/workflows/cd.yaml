name: Deploy to DigitalOcean

# Continuous deployment to a DigitalOcean droplet.
# Triggers ONLY when a semver tag (e.g. v1.2.3) is pushed AND the tagged
# commit is reachable from `main`. The workflow builds a versioned image,
# publishes it to GHCR, then SSHes into the droplet and rolls the stack.
#
# The droplet's deploy folder is expected to already contain:
#   - docker-compose.yaml  (referencing the GHCR image, e.g. ghcr.io/<owner>/<repo>:latest)
#   - .env                 (production environment variables)
#
# Required repository secrets:
#   DROPLET_HOST        Droplet IP or hostname
#   DROPLET_USERNAME    SSH user (e.g. root or a deploy user)
#   DROPLET_SSH_KEY     Private SSH key with access to the droplet
#   DROPLET_SSH_PORT    SSH port (e.g. 22)
#   DEPLOY_PATH         Absolute path of the deploy folder on the droplet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch. Aborting deploy."
            exit 1
          fi

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
